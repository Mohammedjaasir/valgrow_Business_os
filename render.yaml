# Render Blueprint for the ValGrow API (NestJS + Prisma).
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → pick this repo.
# See docs/deploy.md for the full Vercel + Render + Coolify (Postgres) setup.
services:
  - type: web
    name: valgrow-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npm run build --workspace=apps/api
    # The schema is ahead of the committed migrations, so sync it on start.
    # `db push` refuses destructive changes, so a risky schema change fails loudly instead of losing data.
    startCommand: npx prisma db push --skip-generate && node apps/api/dist/src/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false # Coolify Postgres public URL, e.g. postgresql://user:pass@<server-ip>:5432/valgrow?sslmode=require
      - key: WEB_URL
        sync: false # Your Vercel URL, e.g. https://valgrow.vercel.app (used for CORS)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
